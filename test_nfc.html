
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growth Mali - Diagnostic NFC</title>
<style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
    max-width: 650px;
    margin: auto;
}
button {
    padding: 14px;
    background: #176B55;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
}
#status, #stats, #history {
    padding: 14px;
    margin-top: 15px;
    background: #eee;
    border-radius: 7px;
    overflow-wrap: anywhere;
}
.entry {
    border-bottom: 1px solid #ccc;
    padding: 10px 0;
}
</style>
</head>
<body>

<h2>GROWTH MALI</h2>
<h3>Diagnostic NFC - MIFARE Classic</h3>

<button id="start">Démarrer le diagnostic</button>

<div id="status">En attente...</div>

<div id="stats">
Lectures réussies : 0<br>
Erreurs de lecture : 0
</div>

<h3>Historique des événements</h3>
<div id="history"></div>

<script>
let reader;
let started = false;
let readings = 0;
let errors = 0;

const status = document.getElementById("status");
const stats = document.getElementById("stats");
const history = document.getElementById("history");
const button = document.getElementById("start");

function log(message) {
    const entry = document.createElement("div");
    entry.className = "entry";
    entry.textContent =
        new Date().toLocaleTimeString() + " - " + message;
    history.prepend(entry);
}

function updateStats() {
    stats.innerHTML =
        "Lectures réussies : " + readings +
        "<br>Erreurs de lecture : " + errors;
}

button.addEventListener("click", async () => {

    if (started) return;

    if (!("NDEFReader" in window)) {
        status.textContent = "Web NFC non disponible.";
        return;
    }

    try {
        reader = new NDEFReader();

        reader.addEventListener("reading", event => {

            readings++;

            const serial = event.serialNumber || "UID non communiqué";
            const count = event.message.records.length;

            log("LECTURE : Serial Number = " +
                serial + " | Enregistrements NDEF = " + count);

            updateStats();
        });

        reader.addEventListener("readingerror", () => {

            errors++;

            log("ERREUR : tag détecté mais lecture NDEF impossible.");

            updateStats();
        });

        status.textContent = "Démarrage du lecteur...";

        await reader.scan();

        started = true;
        button.disabled = true;

        status.textContent =
            "LECTURE ACTIVE - Présentez une carte NFC.";

        log("Lecteur NFC démarré.");

    } catch (error) {

        status.textContent =
            "ERREUR : " + error.name + " - " + error.message;

        log("ERREUR DE DEMARRAGE : " + error.name);
    }
});
</script>

</body>
</html>
